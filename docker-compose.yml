services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catan_tracker
      POSTGRES_USER: catan
      POSTGRES_PASSWORD: catan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catan -d catan_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catan_tracker
      DB_USERNAME: ${DB_USERNAME:-catan}
      DB_PASSWORD: ${DB_PASSWORD:-catan}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-must-be-at-least-32-characters-long}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
