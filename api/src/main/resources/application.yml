spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catan_tracker}
    username: ${DB_USERNAME:catan}
    password: ${DB_PASSWORD:catan}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:catan-tracker-dev-secret-key-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

bootstrap:
  admin:
    name: ${ADMIN_NAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

server:
  port: 8080
